[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "tang-char-lm"
version = "0.1.0"
description = "Reproducible character-level Tang poetry language model experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Houkiang"}]
license = {text = "MIT"}
keywords = ["language-model", "lstm", "gru", "pytorch", "tang-poetry"]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
train = ["torch>=2.7,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
tang-lm = "tang_char_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
